<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hotel Garuda - Sign In</title>
<link rel="stylesheet" href="stylessign.css" />
</head>
<body>
<header class="site-header">
<nav class="nav">
<div class="brand">Hotel Garuda</div>
<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="feedback.html">Feedback</a></li>
</ul>
</nav>
</header>

<main class="auth-container">
<h2>Sign In</h2>
<form id="signin-form" autocomplete="off" onsubmit="handleSignIn(event)">
<label>
Email
<input type="email" id="email" required placeholder="you@example.com" />
</label>
<label>
Password
<input type="password" id="password" required placeholder="Your password" />
</label>
<button type="submit" class="cta">Sign In</button>
</form>
<p class="note">New here? <a href="feedback.html">Leave feedback</a> or <a href="index.html">Back to Home</a>.</p>
</main>

<script></script>
</script>
</body>
</signin.html>
